[project]
name = "numpy-reference"
version = "0.1.0"
description = "Phase A NumPy reference implementation of a decoder-only Llama-style transformer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numpy_reference"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# torch is a test-only oracle, pinned to the CPU wheel index (no CUDA build).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
